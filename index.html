        <label>Nomor Rekening / Nomor HP (E-Wallet)</label>

<script>

    // Mendeteksi tombol Enter di mana saja (kolom input maupun dropdown bank)

    document.addEventListener('keydown', function(event) {

        if (event.key === 'Enter') {

            event.preventDefault();

            cekData();

        }

    });
 
    async function cekData() {

        const bank = document.getElementById('cekBank').value;

        const norek = document.getElementById('cekNorek').value;

        const hasilDiv = document.getElementById('hasilCek');
 
        if (!norek.trim()) return alert('Masukkan nomor rekening atau nomor HP terlebih dahulu!');
 
        hasilDiv.style.display = 'block';

        hasilDiv.className = 'hasil-box netral';

        hasilDiv.innerHTML = 'Sedang mengecek data...';
 
        try {

            const res = await fetch('/api/cek', {

                method: 'POST',

                headers: { 'Content-Type': 'application/json' },

                body: JSON.stringify({ bank, norek })

            });

            const result = await res.json();
 
            if (!result.ditemukan) {

                hasilDiv.className = 'hasil-box netral';

                hasilDiv.innerHTML = `<strong>Hasil:</strong> ${result.pesan}`;

            } else {

                hasilDiv.className = result.sesuai ? 'hasil-box sesuai' : 'hasil-box tidak-sesuai';

                hasilDiv.innerHTML = `
<strong>Nama Pemilik Rekening:</strong> ${result.namaRekening}<br>
<strong>Nama di Daftar Pelanggan:</strong> ${result.namaPelanggan}<br>
<strong>Status Kecocokan:</strong> ${result.statusPesan}

                `;

            }

        } catch (error) {

            hasilDiv.className = 'hasil-box tidak-sesuai';

            hasilDiv.innerHTML = '<strong>Gagal:</strong> Server belum berjalan atau belum terhubung.';

        }

    }
</script>
